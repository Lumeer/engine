language: java
install: true
services:
  - mongodb
script: ./travis.sh
dist: focal
before_install:
  - curl -s "https://get.sdkman.io" | bash
  - source "$HOME/.sdkman/bin/sdkman-init.sh"
  - export LUMEER_JDK=$(sdk list java | grep -o '25\.[0-9.]*-tem' | head -1)
  - sdk install java $LUMEER_JDK
  - sdk use java $LUMEER_JDK
